source: live probes of /.well-known/ on temp.md, api.temp.md and www.temp.md (2026-09-19)
summary: >-
  Three real documents are served on the apex, one of them also on the API host: the A2A 1.0 agent card
  (/.well-known/agent-card.json, on BOTH temp.md and api.temp.md, byte-identical), an MCP Server Card
  (/.well-known/mcp.json, validating against the modelcontextprotocol.io server-card schema) and a provider-
  defined agent-discovery manifest (/.well-known/agent.json - NOT an A2A card; a temp.md schema that links REST,
  CLI, MCP and A2A surfaces). Nothing RFC 9116 / OAuth / OIDC / api-catalog is served anywhere. The WellKnown
  pointer is earned by the agent card and the MCP server card; no SecurityTxt pointer (no security.txt on any host).
false_positive_watch: >-
  temp.md is an SPA whose catch-all answers HTTP 200 with the 196,623-byte home shell (text/html) for EVERY
  unknown path, including /.well-known/security.txt, /openid-configuration, /oauth-authorization-server,
  /oauth-protected-resource, /api-catalog, /ai-plugin.json and /apis.json. Those 200s are recorded below as
  misses, not hits. api.temp.md answers a real JSON 404 ({"error":"Not found"}) for unknown paths, so its
  statuses can be trusted as-is.
pointer_basis: >-
  WellKnown emitted on the strength of agent-card.json (200, application/json on temp.md; 200,
  application/a2a+json on api.temp.md) and mcp.json (200, application/json). SecurityTxt NOT emitted.
