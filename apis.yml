- name: temp.md Embedded Preview Platform API
  description: >-
    Versioned (/v1) partner API for products that create and govern previews on behalf of opaque end customers:
    Organizations and Applications, server-only Application keys, short-lived delegated publish grants for
    browsers, Application-scoped Preview listing/revocation, frozen review requests with signed viewer
    capabilities and append-only decisions, signed webhook endpoints with delivery inspection, branded preview
    domains (wildcard CNAME + TXT verification) and usage rollups. 27 operations; wrapped by @tempmd/platform.
  image: https://temp.md/opengraph-image.png
  humanURL: https://temp.md/integrations/
  baseURL: https://api.temp.md/v1
  tags:
  - Preview Infrastructure
  - Web Publishing
  - Webhooks
  - Multi-tenant
  properties:
