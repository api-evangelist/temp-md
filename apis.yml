apis:
- name: temp.md MCP Server
  description: >-
    Hosted Streamable HTTP MCP server (serverInfo tempmd-remote 1.0.0, protocol 2025-06-18) exposing eight
    tools - publish_temp, update_temp, get_temp_status, restore_temp, snapshot_temp, set_comments, list_temps,
    recover_update_token - with anonymous publishing and an optional account API key on the connection.
    Inline bundles up to 10 MiB / 20 files; the stdio package @tempmd/mcp covers filesystem publishing
    up to 50 MiB / 100 files. Listed in the official MCP registry as io.github.tempmd/mcp; server card
    at /.well-known/mcp.json.
  image: https://temp.md/opengraph-image.png
  humanURL: https://temp.md/docs#agents
  baseURL: https://api.temp.md/mcp
  tags:
  - MCP
  - AI Agents
  - Agent-Native
  tags_raw:
  - MCP
  - AI Agents
  - agent-native
  properties:
  - type: MCPServer
    url: mcp/temp-md-mcp.yml
  - type: ToolCrosswalk
    url: mcp/temp-md-tool-crosswalk.yml
  - type: Documentation
    url: https://temp.md/docs#agents
- name: temp.md A2A Publisher Agent
  description: >-
    A2A 1.0 agent ("temp.md Publisher") reachable over JSON-RPC at https://api.temp.md/a2a with three
    skills - publish-temp, update-temp, inspect-temp - and SendMessage / GetTask / ListTasks / CancelTask
    operations. Agent card served at /.well-known/agent-card.json on both temp.md and api.temp.md; anonymous
    publish, bearer update token or account API key for task retrieval; no streaming or push notifications.
  image: https://temp.md/opengraph-image.png
  humanURL: https://temp.md/docs#a2a
  baseURL: https://api.temp.md/a2a
  tags:
