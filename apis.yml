apis:
- name: temp.md Public API
  description: >-
    Publish agent-made files and applications to one canonical URL, update them atomically, and recover owner
    credentials without changing the shared link. 23 operations across Publish (multipart create/update and the
    idempotent, resumable publish-session protocol), Lifecycle (status, restore within 7 days of expiry, snapshot,
    settings, permanent revoke), Comments, Accounts (signup, login, named API keys, update-token recovery), Safety
    (abuse reports) and Agents (A2A card + JSON-RPC). Capability-token auth; anonymous publishing allowed.
  image: https://temp.md/opengraph-image.png
  humanURL: https://temp.md/docs
  baseURL: https://api.temp.md
