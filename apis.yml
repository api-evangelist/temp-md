aid: temp-md
name: temp.md
description: >-
  temp.md is an instant web-publishing host built for AI agents: POST an HTML, Markdown, CSV or Mermaid file (or a
  multi-file bundle) and get a stable public URL like slug.temp.md that can be updated in place, snapshotted,
  password-protected, commented on and restored after expiry - no account or API key required to publish. The same
  publishing core is exposed as a REST API (OpenAPI 3.1), a hosted Streamable HTTP MCP server plus a stdio package,
  an A2A 1.0 agent, a CLI, and an Embedded Preview Platform API for products that publish previews on behalf of
  their own customers (delegated publish grants, signed webhooks, branded domains, review workflow).
image: https://temp.md/opengraph-image.png
url: https://raw.githubusercontent.com/api-evangelist/temp-md/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: 'enrichment pass 2026-09-19: full contract discovery run - two OpenAPI 3.1 specs, hosted MCP, A2A 1.0 card, llms.txt, CLI and four npm SDKs found'
