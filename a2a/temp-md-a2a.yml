grade_basis: >-
  Graded against A2A 1.0.0 hard checks: capabilities is an OBJECT (pass - {streaming, pushNotifications,
  extendedAgentCard}); protocolVersion is present (pass - "1.0", carried at supportedInterfaces[0].protocolVersion,
  which is where the released A2A 1.0.0 AgentCard puts it: 1.0.0 replaced the pre-release top-level url /
  preferredTransport / protocolVersion / additionalInterfaces fields with a supportedInterfaces[] array of
  AgentInterface {url, protocolBinding, protocolVersion}); skills is an ARRAY (pass - 3 skills, each with id, name,
  description, tags, examples, inputModes, outputModes). defaultInputModes and defaultOutputModes are both
  declared, so none of the optional-field gaps that separate near-conformant from conformant apply. The
  declared interface is a callable JSON-RPC endpoint on the provider's API host (probed live, answers
  per-method), not a documentation URL - the card is about the API, not about a docs site.
deviations:
- field: protocolVersion (top level)
  observed: absent at the top level; present as supportedInterfaces[0].protocolVersion = "1.0"
  note: >-
    Recorded so a reader grading against the pre-1.0 field layout understands why the hard check passes: the
    card uses the 1.0.0 shape, and a scorer looking only for a top-level protocolVersion would wrongly read it
    as missing. This is the released layout, not a deviation from it.
- field: capabilities.pushNotifications / streaming
  observed: both false
  note: Task completion must be polled via GetTask; no SSE streaming and no push notifications. Consistent with limits.json a2a.streaming=false.
- field: securitySchemes.bearer.bearerFormat
  observed: 'tempmd_key_... or scoped update token'
  note: Free-text hint rather than a registered bearer format; harmless, but a client cannot machine-select the credential type from it.
