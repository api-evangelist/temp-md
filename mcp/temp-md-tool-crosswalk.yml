  binding: rest
  confidence: high
- tool: restore_temp
  category: lifecycle
  rest: [restoreTemp]
  binding: rest
  confidence: high
- tool: snapshot_temp
  category: lifecycle
  rest: [snapshotTemp]
  binding: rest
  confidence: high
  note: 'label maps to the optional JSON body {"label": ...}.'
- tool: set_comments
  category: settings
