method: derived
source: >-
  Derived by binding the LIVE tools/list of https://api.temp.md/mcp (8 tools, mcp/temp-md-mcp-tools.json) and the
  three A2A skills in a2a/temp-md-agent-card.json to the operationIds of openapi/temp-md-openapi.yml (23
  operations) - both fetched 2026-09-19. Nothing here is gated: the MCP schema, the agent card and the OpenAPI
  are all public, so every binding is checked against real input schemas rather than by name alone.
purpose: >-
  temp.md exposes one publishing core through four surfaces - REST, remote/stdio MCP, A2A 1.0 and a CLI - that
  overlap but are not identical. The MCP tools take inline file bundles (UTF-8/base64 JSON) where REST takes
  multipart or a hashed publish-session manifest; the A2A skills wrap the same operations as data parts.
surfaces:
  rest_openapi: openapi/temp-md-openapi.yml            # 23 operations; verbatim source openapi/_original/temp-md-openapi.json
  rest_platform_openapi: openapi/temp-md-platform-openapi.yml   # 27 partner-platform operations; no MCP tool touches them
  mcp: https://api.temp.md/mcp                          # tools/list OPEN (anonymous); schemas in mcp/temp-md-mcp-tools.json
  a2a: https://api.temp.md/a2a                          # JSON-RPC 1.0; SendMessage data-part operations publish|update|status
  graphql: null
crosswalk:
- tool: publish_temp
  category: publish
  rest: [createTemp, createPublishSession, uploadPublishSessionFile, finalizePublishSession]
  binding: rest
  confidence: high
  note: >-
    Semantically createTemp (single request, anonymous, returns tempId/canonicalUrl/updateToken). The MCP tool takes
    files[] inline as JSON (content + encoding utf8|base64) rather than multipart, and its idempotency_key maps to
    the Idempotency-Key header that only the publish-session path accepts in REST - so the closest full-fidelity
    REST equivalent for an idempotent publish is the three-step session flow.
- tool: update_temp
  category: publish
  rest: [updateTemp, createPublishSession, uploadPublishSessionFile, finalizePublishSession]
  binding: rest
  confidence: high
  note: PUT /temps/{tempId} with the scoped update token; the session path is the idempotent/resumable equivalent (tempId in the manifest).
