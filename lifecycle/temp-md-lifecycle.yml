resource_lifecycle:
  note: >-
    The provider's lifecycle story is about the hosted object (a Temp), and it is unusually well specified -
    machine-readable in limits.json and mirrored in the TempStatus schema (LifecycleStatus enum drafting | active |
    cooling | expired; fields expiresAt, coolingStartsAt, restoreUntil, restoreEligible).
  states: [drafting, active, cooling, expired, (revoked), (removed by moderation)]
  active_window: 7 days from the last publish or update (limits.json activeWindowSeconds 604800); every update resets it
  cooling_window: 48 hours after the active window before expiry (coolingWindowSeconds 172800)
  restore_grace: 7 days after expiry during which POST /temps/{tempId}/restore reactivates the same URL (restoreGraceSeconds 604800)
  after_grace: deleted; a new Temp (new URL) is the only option
  claimed: no expiry, no grace period - retained until the owner deletes it or closes the account (privacy policy)
  publish_session_ttl: 3600 seconds (publishSessionTtlSeconds)
  revocation: DELETE /temps/{tempId} is permanent - "Revocation invalidates the Temp's update and claim capabilities and deletes every stored Version. It cannot be restored." (docs#revoke)
  snapshots: POST /temps/{tempId}/snapshot freezes the current Version at <slug>.temp.md/__v/<versionId>; the canonical URL keeps serving latest
  failed_updates: >-
    'A failed update never replaces the live version.' (llms.txt) - promotion is atomic at finalize
  source: https://temp.md/docs#lifecycle
