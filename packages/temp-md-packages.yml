source: >-
  registry.npmjs.org metadata for the @tempmd scope (fetched 2026-09-19), the provider's own llms.txt
  (https://temp.md/llms.txt), agent manifest (https://temp.md/.well-known/agent.json), docs
  (https://temp.md/docs#agents) and the github.com/tempmd organization. PyPI (pypi.org/pypi/tempmd/json -> 404)
  and the other registries hold nothing first-party.
summary:
  first_party_sdk_count: 4
  first_party_package_count: 6
  note: >-
    Every first-party package is on npm under the @tempmd scope and points at homepage temp.md; the monorepo they
    cite (github.com/tempmd/tempmd) returns 404 from the GitHub API, so the CLI/client/platform source is not
    public — only the MCP server (github.com/tempmd/tempmd-mcp) and the editor plugins are. All releases are
    recent (2026-08-26 to 2026-09-06), later than the OpenAPI they wrap, so there is no abandonment signal here.
github_organization:
  found: true
  url: https://github.com/tempmd
  checked: '2026-09-19'
  note: >-
    14 public repos; the first-party ones are tempmd-mcp, grapesjs-plugin-tempmd, yank-note-extension-tempmd and
