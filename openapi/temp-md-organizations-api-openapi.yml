openapi: 3.2.0
info:
  title: Temp Md Organizations API
  version: 0.1.0
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: temp-md-platform-openapi.json, temp-md-platform-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.temp.md
tags:
- name: Organizations
paths:
  /v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an Organization
      security:
      - dashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - slug
              properties:
                name:
                  type: string
                  maxLength: 80
                slug:
                  type: string
                  maxLength: 48
                  pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
      responses:
        '201':
          description: Organization created
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
      - Organizations
    servers:
    - url: https://api.temp.md
  /v1/organizations/{organizationId}:
    get:
      operationId: getOrganization
      summary: Get an Organization and its Applications
      security:
      - dashboardBearer: []
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization and Applications
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
      - Organizations
    servers:
    - url: https://api.temp.md
  /v1/organizations/{organizationId}/applications:
    post:
      operationId: createApplication
      summary: Create a partner Application
      security:
      - dashboardBearer: []
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 80
                environment:
                  enum:
                  - production
                  - staging
                  - development
      responses:
        '201':
          description: Application created
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
      - Organizations
    servers:
    - url: https://api.temp.md
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    dashboardBearer:
      type: http
      scheme: bearer
      description: A Temp.md dashboard session or personal account API key.
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: tempmd_app_<id>_<secret>
      description: Server-only Application key with explicit scopes.
    publishGrantBearer:
      type: http
      scheme: bearer
      bearerFormat: tempmd_grant_<id>_<secret>
      description: Short-lived, one-session delegated publishing authority.
    reviewBearer:
      type: http
      scheme: bearer
      bearerFormat: tempmd_view_<id>_<secret>
      description: Short-lived viewer capability bound to one frozen review request.
x-refined-from:
- temp-md-platform-openapi.json
- temp-md-platform-openapi.yml
